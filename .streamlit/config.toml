[theme]
base = "light"
primaryColor = "#C0392B"
backgroundColor = "#F8F9FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1A1A1A"
font = "sans serif"

[server]
maxUploadSize = 200
# Disabled so the file_uploader works behind the Hugging Face Spaces proxy (otherwise uploads
# return AxiosError 403). The Space is private and login-gated, so the risk is contained.
enableXsrfProtection = false
enableCORS = false

[browser]
gatherUsageStats = false
