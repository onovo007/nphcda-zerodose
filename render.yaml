services:
  - type: web
    name: nphcda-zerodose-platform
    runtime: python
    # 'pro' = 4 GB RAM / 2 CPU. The full stack (pymc + pytensor + numba + geopandas + prophet +
    # arviz + matplotlib) idles near 1-1.5 GB, so 2 GB Standard can OOM during a live model run
    # (seen as a health-check 'connection reset' and instance restart). 4 GB gives safe headroom.
    plan: pro
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      # numpy 1.26.4 has cp312 wheels only, so pin Python to 3.12 (do not let Render use 3.13).
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: PYTENSOR_FLAGS
        value: "cxx="
