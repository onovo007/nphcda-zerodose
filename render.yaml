services:
  - type: web
    name: nphcda-zerodose-platform
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: PYTENSOR_FLAGS
        value: "cxx="
