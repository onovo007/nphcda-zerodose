   <g id="text_1">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f3b57" x="131.904" y="60.59625" transform="rotate(-0 131.904 60.59625)">1  Household surveys</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #27343d" transform="translate(131.904 86.527687)">NDHS 2008, 2013, 2018, 2023-24</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #27343d" transform="translate(131.904 99.244406)">148 state results with sampling error</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #27343d" transform="translate(131.904 112.294406)">Sets the level in every state</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f3b57" x="131.904" y="165.93225" transform="rotate(-0 131.904 165.93225)">2  Local context (covariates)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #27343d" transform="translate(131.904 191.943141)">Maternal care, water, wealth,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #27343d" transform="translate(131.904 204.580406)">travel time, conflict, poverty</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #27343d" transform="translate(131.904 217.630406)">for every LGA</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f3b57" x="131.904" y="262.95225" transform="rotate(-0 131.904 262.95225)">3  Neighbours (spatial)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #27343d" transform="translate(131.904 288.550406)">GRID3 boundaries: 2,165 pairs of</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #27343d" transform="translate(131.904 301.600406)">neighbouring LGAs share information</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1c5e33" x="388.584" y="132.66825" transform="rotate(-0 388.584 132.66825)">Bayesian small-area model</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #27343d" transform="translate(388.584 159.138281)">Each LGA has its own zero-dose rate.</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #27343d" transform="translate(388.584 171.316406)">The population-weighted average of an</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #27343d" transform="translate(388.584 184.366406)">state's LGA rates must match its survey</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #27343d" transform="translate(388.584 197.416406)">results, within sampling error.</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #27343d" transform="translate(388.584 210.466406)">Covariates and neighbours explain</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #27343d" transform="translate(388.584 224.388281)">how rates differ inside each state.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8a3a0f" x="650.844" y="60.59625" transform="rotate(-0 650.844 60.59625)">Outputs for every LGA</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #27343d" transform="translate(650.844 87.066281)">Zero-dose rate and number of</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #27343d" transform="translate(650.844 99.657141)">children, 2026-2028</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #27343d" transform="translate(650.844 113.166281)">95% credible intervals</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #27343d" transform="translate(650.844 125.344406)">Priority probability (top 20%)</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f3b57" x="650.844" y="204.74025" transform="rotate(-0 650.844 204.74025)">Built-in checks</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #27343d" transform="translate(650.844 230.338406)">Fit to all survey rounds</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #27343d" transform="translate(650.844 243.388406)">Independent survey (NmDHS 2025-26)</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #27343d" transform="translate(650.844 256.438406)">Independent LGA map (IHME 2018)</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #27343d" transform="translate(650.844 269.488406)">Convergence diagnostics</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f3b57" x="116.28" y="18.517969" transform="rotate(-0 116.28 18.517969)">How the Bayesian small-area model combines surveys, local context and neighbours</text>
   </g>
  </g>
  <g id="text_14">
   <text style="font-style: italic; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5b6b79" x="8.64" y="393.476719" transform="rotate(-0 8.64 393.476719)">All 774 LGAs. Inference by Markov chain Monte Carlo (4 chains x 8,000 draws).</text>
  </g>
 </g>
